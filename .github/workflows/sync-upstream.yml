name: Sync fork with upstream

on:
  schedule:
    # 每天 10:00（北京时间）同步一次上游更新
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xiaoyang111222/cn-math-taxonomy.git
          git fetch upstream
          git checkout main
          set +e
          git merge upstream/main --no-commit --no-ff
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && [ -z "$(git ls-files -u)" ]; then
            echo "Merge failed without conflicts; aborting."
            exit 1
          fi
          for f in $(git ls-files -u | awk '{print $4}' | sort -u); do
            case "$f" in
              .github/workflows/*)
                if git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git checkout HEAD -- "$f"
                else
                  git rm -f -- "$f"
                fi
                ;;
              *)
                echo "Conflict outside .github/workflows/: $f"
                exit 1
                ;;
            esac
          done
          git restore --staged -- .github/workflows/
          git checkout HEAD -- .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "Merge remote-tracking branch 'upstream/main'"
          fi
          git push origin main
